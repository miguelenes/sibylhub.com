[package]
name = "sibyl-gateway-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "sibyl-gateway: response cache (in-memory / Redis / semantic)"

[dependencies]
sibyl-gateway-hub = { path = "../sibyl-gateway-hub" }
sibyl-gateway-core = { path = "../sibyl-gateway-core" }
sibyl-gateway-obs = { path = "../sibyl-gateway-obs" }
sibyl-gateway-redis = { path = "../sibyl-gateway-redis", optional = true }
tokio.workspace = true
async-trait.workspace = true
dashmap.workspace = true
serde_json.workspace = true
thiserror.workspace = true
moka.workspace = true
redis = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[features]
default = ["memory"]
memory = []
redis = ["dep:redis", "dep:sibyl-gateway-redis"]
