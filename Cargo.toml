[workspace]
members = ["apps/backend", "apps/cli"]
resolver = "2"
default-members = ["apps/backend", "apps/cli"]

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/sibylhub/sibylhub.com"

[workspace.dependencies]
anyhow = "=1.0.100"
axum = "=0.7.9"
clap = { version = "=4.5.48", features = ["derive", "env"] }
http = "=1.3.1"
indicatif = "=0.17.11"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "=2.0.17"
tokio = { version = "=1.40.0", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower-http = { version = "=0.6.6", features = ["cors", "trace"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "json"] }
