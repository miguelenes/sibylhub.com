[workspace]
members = ["apps/backend", "apps/cli"]
resolver = "2"
default-members = ["apps/backend", "apps/cli"]

[workspace.package]
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/sibylhub/sibylhub.com"

[workspace.dependencies]
assert_cmd = "=2.0.17"
anyhow = "=1.0.100"
axum = "=0.7.9"
clap = { version = "=4.5.48", features = ["cargo", "derive", "env"] }
comfy-table = "=7.1.4"
console = "=0.15.11"
http = "=1.3.1"
indicatif = "=0.17.11"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
predicates = "=3.1.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_yaml = "=0.9.34"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
tempfile = "=3.23.0"
thiserror = "=2.0.17"
toml = "=0.8.23"
tokio = { version = "=1.40.0", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower-http = { version = "=0.6.6", features = ["cors", "trace", "timeout"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "json"] }
