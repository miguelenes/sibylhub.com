[workspace]
members = ["apps/backend", "apps/cli"]
resolver = "2"
default-members = ["apps/backend", "apps/cli"]

[workspace.package]
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/sibylhub/sibylhub.com"

[workspace.dependencies]
assert_cmd = "=2.2.2"
anyhow = "=1.0.104"
axum = "=0.8.3"
clap = { version = "=4.6.6", features = ["cargo", "derive", "env"] }
comfy-table = "=8.0.0"
console = "=0.16.6"
http = "=1.5.0"
indicatif = "=0.18.6"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
predicates = "=3.1.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml = "=0.9.34"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
toml = "=1.1.6"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower-http = { version = "=0.7.1", features = ["cors", "trace", "timeout"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
